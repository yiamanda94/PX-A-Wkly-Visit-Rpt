<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PX-A-Wkly-Visit-Rpt｜11/16～11/19</title>
<style>
:root{
  --navy:#16213e;--navy2:#24345f;--ink:#1c2541;--gold:#d4a843;--gold2:#f0d48a;--gold-l:#fbf3df;
  --bg:#f3f1ec;--card:#fff;--line:#e8e3d8;--mut:#6b7280;
  --ok:#1f9d63;--ok-l:#e2f5ec;--warn:#d9822b;--warn-l:#fdeedd;--red:#d64545;--red-l:#fdeaea;--info:#5b6b8c;--info-l:#eceff5;
  --r:16px;--sh:0 1px 2px rgba(22,33,62,.05),0 8px 24px rgba(22,33,62,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
.hidden{display:none!important}
/* ===== hero ===== */
.hero{background:radial-gradient(1200px 400px at 85% -20%,rgba(212,168,67,.35),transparent 60%),linear-gradient(135deg,#0f1830 0%,var(--navy) 45%,var(--navy2) 100%);color:#fff;padding:26px 24px 0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;border:40px solid rgba(255,255,255,.04)}
.wrap{max-width:1320px;margin:0 auto;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;box-shadow:0 6px 16px rgba(212,168,67,.35)}
.brand h1{margin:0;font-size:26px;letter-spacing:.5px;font-weight:800}
.range{background:rgba(212,168,67,.18);color:var(--gold2);border:1px solid rgba(212,168,67,.45);padding:4px 14px;border-radius:999px;font-weight:700;font-size:15px}
.brand .desc{color:#aeb8d0;font-size:13.5px;width:100%;margin-top:-4px;padding-left:60px}
.kstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:22px}
.ks{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 16px;backdrop-filter:blur(4px)}
.ks .l{color:#aeb8d0;font-size:12.5px;display:flex;align-items:center;gap:6px}
.ks .v{font-size:26px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.ks .v small{font-size:13px;color:#aeb8d0;font-weight:500;margin-left:3px}
.ks.warn .v{color:#ffb86b}
.navbar{position:sticky;top:0;z-index:30;background:rgba(22,33,62,.97);backdrop-filter:blur(8px);box-shadow:0 4px 18px rgba(0,0,0,.12)}
.navin{max-width:1320px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{border:0;background:transparent;color:#aeb8d0;padding:14px 16px 12px;font-size:15px;border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:.15s}
.tab:hover{color:#fff}
.tab.on{color:#fff;border-bottom-color:var(--gold);font-weight:700}
.tab .ic{font-size:17px}
.tab .badge{background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.dates{display:flex;gap:6px;margin-left:auto;padding:8px 0;overflow-x:auto}
.chip{border:1px solid rgba(255,255,255,.22);background:transparent;color:#dfe5f2;border-radius:999px;padding:6px 14px;font-size:13.5px;white-space:nowrap;transition:.15s}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:800}
.chip .wd{opacity:.7;font-size:12px;margin-left:3px}
main{max-width:1320px;margin:0 auto;padding:24px 24px 70px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.sec-h h2{margin:0;font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.sec-h h2 .bar{width:6px;height:22px;border-radius:3px;background:linear-gradient(var(--gold),var(--gold2))}
.sec-h .sub{color:var(--mut);font-size:13.5px}
h3.blk{font-size:16px;margin:28px 0 12px;display:flex;align-items:center;gap:8px}
/* ===== filters ===== */
.fpanel{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin-bottom:18px;display:grid;gap:10px}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.frow .lb{color:var(--mut);font-size:12.5px;width:48px;flex:none}
.pills{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
.pill:hover{border-color:var(--gold)}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pill .n{font-size:11.5px;opacity:.65}
.pill .dt{width:8px;height:8px;border-radius:50%}
.search{flex:1;min-width:180px;max-width:320px;position:relative}
.search input{width:100%;border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 36px;font-size:14px;font-family:inherit;outline:none;background:#faf9f6}
.search input:focus{border-color:var(--gold);background:#fff}
.search::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.6}
.seg{display:inline-flex;background:#f1eee6;border-radius:999px;padding:3px;margin-left:auto}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:13.5px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}
/* ===== store cards ===== */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.scard{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column}
.scard:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(22,33,62,.14)}
.cover{position:relative;aspect-ratio:4/3;background:#dfe3ea;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.scard:hover .cover img{transform:scale(1.05)}
.cover .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,transparent 30%,transparent 50%,rgba(10,15,30,.85) 100%)}
.cover .tl{position:absolute;left:12px;top:12px;display:flex;gap:6px}
.tag{border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:#fff;backdrop-filter:blur(4px)}
.cover .cnt{position:absolute;right:12px;top:12px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px}
.cover .nm{position:absolute;left:14px;right:14px;bottom:10px;color:#fff}
.cover .nm b{font-size:19px;display:block;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.cover .nm span{font-size:12.5px;opacity:.85}
.cover .mini{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
.cover .mini i{width:34px;height:34px;border-radius:6px;overflow:hidden;border:2px solid rgba(255,255,255,.85);background:#ccc}
.cover .mini i img{width:100%;height:100%;object-fit:cover}
.sbody{padding:12px 14px 14px;display:grid;gap:8px}
.cats{display:flex;gap:5px;flex-wrap:wrap}
.cb{font-size:12px;border-radius:7px;padding:3px 8px;background:#f5f2ea;color:#5b4a1e}
.cb.no{background:#f4f4f4;color:#b3b3b3;text-decoration:line-through}
.note{background:var(--red-l);color:#a52a2a;border-radius:9px;padding:7px 10px;font-size:13px;line-height:1.45;border-left:3px solid var(--red)}
.note.sm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.ok{background:var(--ok-l);color:var(--ok)}.st.warn{background:var(--warn-l);color:var(--warn)}.st.etc{background:var(--info-l);color:var(--info)}
/* ===== photo wall ===== */
.wall{columns:5 200px;column-gap:12px}
.wp{break-inside:avoid;margin-bottom:12px;border-radius:12px;overflow:hidden;position:relative;cursor:zoom-in;background:#dfe3ea;box-shadow:var(--sh)}
.wp img{width:100%;display:block;min-height:120px}
.wp .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;font-size:12px;line-height:1.35}
.wp .cap b{display:block;font-size:13px}
.ph-skel{background:linear-gradient(90deg,#e6e8ee 25%,#f2f3f6 50%,#e6e8ee 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.loadbox{background:var(--card);border-radius:var(--r);padding:16px;text-align:center;color:var(--mut);margin-bottom:16px;box-shadow:var(--sh)}
.pbar{height:6px;background:#eee;border-radius:3px;overflow:hidden;max-width:360px;margin:8px auto 0}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .2s}
.empty{padding:40px;text-align:center;color:var(--mut);background:var(--card);border-radius:var(--r);border:2px dashed var(--line)}
/* ===== staff ===== */
.rank{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;margin-bottom:18px}
.rk{display:grid;grid-template-columns:150px 1fr 46px;gap:10px;align-items:center;padding:5px 0;cursor:pointer}
.rk:hover .rkb i{filter:brightness(1.08)}
.rk .rn{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .rn small{color:var(--mut);margin-left:4px}
.rkb{height:14px;background:#f1eee6;border-radius:7px;overflow:hidden}
.rkb i{display:block;height:100%;border-radius:7px}
.rk .rv{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.pcard{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;border-top:4px solid var(--c,#999);scroll-margin-top:80px}
.pcard.flash{animation:fl 1.6s}
@keyframes fl{0%,40%{box-shadow:0 0 0 4px var(--gold2)}}
.ph{display:flex;gap:12px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;background:var(--c,#999);color:#fff;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;flex:none}
.ph .nm{font-weight:800;font-size:17px}
.ph .nm small{font-weight:500;color:var(--mut);font-size:12.5px;margin-left:6px}
.ph .of{font-size:12.5px;color:var(--mut)}
.pst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.pst div{background:#f7f5ef;border-radius:10px;padding:7px 10px;text-align:center}
.pst b{display:block;font-size:19px}
.pst span{font-size:11.5px;color:var(--mut)}
.day{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:8px 0;border-top:1px dashed var(--line)}
.day .dl{font-weight:800;color:#8a6a1e;font-size:13px;padding-top:4px}
.sl{display:flex;flex-wrap:wrap;gap:6px}
.sc{border:1px solid var(--line);background:#fbfaf6;border-radius:9px;padding:4px 10px;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.sc:hover{border-color:var(--gold);background:var(--gold-l)}
.sc .d{width:7px;height:7px;border-radius:50%}
.sc img{width:22px;height:22px;border-radius:5px;object-fit:cover}
/* ===== oos ===== */
.osum{display:grid;grid-template-columns:auto 1fr;gap:24px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px 22px;margin-bottom:18px;align-items:center}
.donut{width:150px;height:150px;border-radius:50%;position:relative}
.donut::after{content:"";position:absolute;inset:22px;border-radius:50%;background:#fff}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1}
.donut .c b{font-size:32px;line-height:1}
.donut .c span{font-size:12px;color:var(--mut);margin-top:4px}
.leg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.lg{border-radius:12px;padding:12px 14px;cursor:pointer;border:2px solid transparent;transition:.15s}
.lg.on{border-color:currentColor}
.lg .t{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.lg .v{font-size:28px;font-weight:800;margin-top:2px}
.lg .v small{font-size:13px;font-weight:600;margin-left:4px;opacity:.75}
.lg.ok{background:var(--ok-l);color:var(--ok)}.lg.warn{background:var(--warn-l);color:var(--warn)}.lg.etc{background:var(--info-l);color:var(--info)}.lg.all{background:#f3f1ec;color:var(--ink)}
.olist{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.oc{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:14px 16px 14px 18px;position:relative;cursor:pointer;display:grid;grid-template-columns:64px 1fr;gap:14px;transition:.15s}
.oc:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(22,33,62,.12)}
.oc::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--sc)}
.oc .th{width:64px;height:64px;border-radius:10px;overflow:hidden;background:#e6e8ee}
.oc .th img{width:100%;height:100%;object-fit:cover}
.oc .tp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.oc .tp b{font-size:16px}
.oc .mt{font-size:12.5px;color:var(--mut);margin:3px 0 6px}
.oc .tx{font-size:14px;line-height:1.55}
/* ===== summary ===== */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kc{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;position:relative;overflow:hidden}
.kc .ic{position:absolute;right:12px;top:10px;font-size:30px;opacity:.18}
.kc .l{font-size:13px;color:var(--mut)}
.kc .v{font-size:32px;font-weight:800;margin-top:4px}
.kc.click{cursor:pointer}.kc.click:hover{outline:2px solid var(--gold2)}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px}
.panel h4{margin:0 0 14px;font-size:15px}
.chart{display:flex;align-items:flex-end;gap:18px;height:220px;padding:10px 6px 0;border-bottom:1px solid var(--line)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer}
.col .bx{width:100%;max-width:70px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--navy2),var(--navy));position:relative;transition:.2s;min-height:4px}
.col:hover .bx{background:linear-gradient(180deg,var(--gold),#b98d2c)}
.col .bv{font-weight:800;font-size:15px;margin-bottom:6px}
.col .bv small{display:block;text-align:center;font-weight:500;color:var(--mut);font-size:11px}
.xl{display:flex;gap:18px;padding:8px 6px 0}
.xl div{flex:1;text-align:center;font-size:13px;font-weight:700}
.otbl{width:100%;border-collapse:collapse}
.otbl th{font-size:12.5px;color:var(--mut);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.otbl td{padding:9px 8px;border-bottom:1px solid #f1eee6;font-size:14px}
.otbl tr.rl{cursor:pointer}.otbl tr.rl:hover td{background:#faf8f2}
.otbl .num{text-align:right;font-variant-numeric:tabular-nums}
.ib{display:flex;align-items:center;gap:8px}
.ib i{height:10px;border-radius:5px;display:block}
.acc{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.acc summary{list-style:none;padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:800}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"▾";margin-left:auto;color:var(--mut);transition:.2s}
.acc[open] summary::after{transform:rotate(180deg)}
.acc .in{padding:0 18px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ob{border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-left:4px solid var(--c)}
.ob h5{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between}
.ob .r{font-size:13px;margin:6px 0}
.ob .r b{margin-right:4px}
/* ===== modal / lightbox ===== */
.modal{position:fixed;inset:0;background:rgba(10,15,30,.62);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow-y:auto}
.mbox{background:#fff;border-radius:20px;width:100%;max-width:1040px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .2s ease-out}
@keyframes pop{from{transform:translateY(12px);opacity:0}}
.mh{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:20px 24px;position:relative;border-top:5px solid var(--c)}
.mh h3{margin:0;font-size:24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gr{background:var(--red);color:#fff;border-radius:999px;padding:2px 12px;font-size:13px}
.mh .meta{color:#c4cce0;margin-top:6px;font-size:14px;display:flex;gap:14px;flex-wrap:wrap}
.mclose{position:absolute;right:16px;top:16px;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:50%;width:36px;height:36px;font-size:18px}
.mnav{display:flex;gap:8px;position:absolute;right:62px;top:16px}
.mnav button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:7px 12px;font-size:13px}
.mb{padding:18px 24px 24px}
.mb .note{font-size:14px;margin-bottom:12px}
.osm{display:grid;gap:8px;margin-bottom:6px}
.osm div{border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.5}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-top:6px}.cs{margin-top:12px;background:#faf9f6;border-radius:14px;padding:12px}
.cs h4{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.cs h4 .n{color:var(--mut);font-weight:500;font-size:13px}
.cs .none{color:#b3b3b3;font-size:13px;background:#f8f8f8;border-radius:10px;padding:12px;text-align:center}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.tg .t{aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#dfe3ea;cursor:zoom-in}
.tg .t img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.tg .t:hover img{transform:scale(1.05)}
#lb{position:fixed;inset:0;background:rgba(5,8,16,.95);z-index:70;display:flex;align-items:center;justify-content:center;flex-direction:column}
#lb img{max-width:94vw;max-height:80vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#lb .cap{color:#fff;margin-top:14px;font-size:14px;text-align:center}
#lb .cap b{color:var(--gold2)}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.12);color:#fff;font-size:30px;width:52px;height:72px;border-radius:12px}
#lb .prev{left:12px}#lb .next{right:12px}
#lb .x{position:absolute;right:16px;top:14px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:20px;width:42px;height:42px;border-radius:50%}
#lb .strip{display:flex;gap:6px;margin-top:12px;max-width:94vw;overflow-x:auto;padding:4px}
#lb .strip img{width:46px;height:58px;object-fit:cover;border-radius:6px;opacity:.45;cursor:pointer;max-height:none;box-shadow:none}
#lb .strip img.on{opacity:1;outline:2px solid var(--gold)}
.totop{position:fixed;right:18px;bottom:18px;z-index:40;border:0;width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;font-size:18px;box-shadow:0 8px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.2s}

/* ---------- photo loading ---------- */
/*v209-loader*/const BINP={};
async function loadBin(f,onp){
  if(BINP[f])return BINP[f];
  BINP[f]=(async()=>{
    const r=await fetch(f);if(!r.ok)throw new Error(r.status);
    const total=+r.headers.get('content-length')||0;const rd=r.body.getReader();const ch=[];let got=0;
    for(;;){const {done,value}=await rd.read();if(done)break;ch.push(value);got+=value.length;onp&&total&&onp(got/total)}
    const buf=new Uint8Array(got);let o=0;for(const c of ch){buf.set(c,o);o+=c.length}
    const hl=new DataView(buf.buffer).getUint32(0,true);const idx=JSON.parse(new TextDecoder().decode(buf.slice(4,4+hl)));const base=4+hl;
    for(const [id,off,len] of idx)IMG[id]=URL.createObjectURL(new Blob([buf.slice(base+off,base+off+len)],{type:'image/jpeg'}));
    if(typeof fillImgs==='function')fillImgs();
  })();
  try{return await BINP[f]}catch(e){delete BINP[f];throw e}
}
async function loadDate(d,onp){
  if(loaded[d])return;if(loading[d])return loading[d];
  loading[d]=(async()=>{const fs=[].concat(D.files[d]||[]);for(let k=0;k<fs.length;k++){await loadBin(fs[k],p=>onp&&onp((k+p)/fs.length))}loaded[d]=true})();
  try{return await loading[d]}catch(e){delete loading[d];throw e}
}
function fillImgs(root=document){root.querySelectorAll('img[data-id]').forEach(i=>{if(!i.getAttribute('src')&&IMG[i.dataset.id]){i.src=IMG[i.dataset.id];i.classList.remove('ph-skel')}})}
async function ensure(){
  const need=DATES.filter(d=>inD(d)&&!loaded[d]);if(!need.length)return;
  const lw=document.getElementById('lw');let box=null;
  if(lw){box=document.createElement('div');box.className='loadbox';box.innerHTML='照片載入中…<div class="pbar"><i id="pb"></i></div>';lw.appendChild(box)}
  let done=0;
  try{for(const d of need){await loadDate(d,f=>{const b=document.getElementById('pb');if(b)b.style.width=((done+f)/need.length*100)+'%'});done++;fillImgs()}box&&box.remove()}
  catch(e){if(box)box.innerHTML='照片載入失敗，請重新整理頁面再試一次'}
}

  let h=`<div class="mh" style="--c:${OC[v.office]}"><button class="mclose" onclick="closeModal()">✕</button>
   ${k>=0?`<div class="mnav"><button onclick="openStore(${sib[(k-1+sib.length)%sib.length].i})">‹ 上一家</button><button onclick="openStore(${sib[(k+1)%sib.length].i})">下一家 ›</button></div>`:''}
   <h3>${esc(v.store)}${v.grade?`<span class="gr">${v.grade} 級點</span>`:''}</h3>
   <div class="meta"><span>🏢 ${esc(v.office)}</span><span>👤 ${esc(v.staff)}</span><span>📅 ${v.date}（${wd(v.date)}）</span><span>📷 ${v.photos.length} 張</span></div></div><div class="mb">
   ${v.note&&!oo.some(o=>o.note===v.note)?`<div class="note">📝 備註：${esc(v.note)}</div>`:''}
   ${oo.length?`<div class="osm">${oo.map(o=>`<div style="background:var(--${stc(o.status)==='etc'?'info':stc(o.status)}-l)"><span class="st ${stc(o.status)}">${o.status}</span>　${esc(o.note)}</div>`).join('')}</div>`:''}`;
  h+='<div class="cgrid">';
  for(const [c,ic] of CATS){const ph=v.photos.filter(p=>p.cat===c);
    h+=`<div class="cs"><h4>${ic} ${c} <span class="n">${ph.length} 張</span></h4>${ph.length?`<div class="tg">${ph.map(p=>`<div class="t" onclick="openLB(${i},'${p.id}')">${img(p.id)}</div>`).join('')}</div>`:`<div class="none">尚無照片</div>`}</div>`}
  const mb=document.getElementById('mbox');mb.innerHTML=h+'</div></div>';
  const m=document.getElementById('modal');m.classList.remove('hidden');m.scrollTop=0;document.body.style.overflow='hidden';
  loadDate(v.date).then(()=>fillImgs(mb)).catch(()=>{});
}
function closeModal(){document.getElementById('modal').classList.add('hidden');document.body.style.overflow='';CUR=null}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
/* ---------- lightbox ---------- */
let LB={list:[],k:0};
function openLB(i,id){const v=D.visits[i];const list=v.photos.map(p=>({...p,v}));openLBList(list,list.findIndex(p=>p.id===id))}
function openLBList(list,k){LB={list,k:Math.max(0,k)};document.getElementById('lb').classList.remove('hidden');
  document.getElementById('lbstrip').innerHTML=list.length<=60?list.map((p,j)=>`<img data-id="${p.id}" ${IMG[p.id]?`src="${IMG[p.id]}"`:''} onclick="LB.k=${j};showLB()">`).join(''):'';showLB()}
async function showLB(){const p=LB.list[LB.k];const im=document.getElementById('lbimg');
  if(!IMG[p.id]){im.removeAttribute('src');try{await loadDate(p.v.date)}catch(_){}}
  im.src=IMG[p.id]||'';document.getElementById('lbcap').innerHTML=`<b>${esc(p.v.store)}</b>　${CI[p.cat]} ${p.cat}　｜　${md(p.v.date)}・${esc(nm(p.v.staff))}　｜　${LB.k+1} / ${LB.list.length}`;
  document.querySelectorAll('#lbstrip img').forEach((e,j)=>{e.classList.toggle('on',j===LB.k);if(j===LB.k)e.scrollIntoView({block:'nearest',inline:'center'})})}
function stepLB(d){LB.k=(LB.k+d+LB.list.length)%LB.list.length;showLB()}
function closeLB(){document.getElementById('lb').classList.add('hidden')}
document.addEventListener('keydown',e=>{const lb=!document.getElementById('lb').classList.contains('hidden');
  if(e.key==='Escape'){lb?closeLB():closeModal()}if(lb&&e.key==='ArrowRight')stepLB(1);if(lb&&e.key==='ArrowLeft')stepLB(-1)});
let tx=0;const lbe=document.getElementById('lb');lbe.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
lbe.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)stepLB(dx<0?1:-1)});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;clearTimeout(window._t);window._t=setTimeout(()=>{render();const q=document.getElementById('q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}},350)}});
addEventListener('scroll',()=>document.getElementById('totop').classList.toggle('show',scrollY>600),{passive:true});
render();
</script>
