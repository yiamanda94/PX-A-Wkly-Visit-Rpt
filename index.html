<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PX-A-Wkly-Visit-Rpt｜11/9～11/13</title>
<style>
:root{--navy:#1f2a44;--navy2:#2c3a5c;--gold:#c9a24a;--gold-l:#f3e8cc;--bg:#f5f3ee;--card:#fff;--line:#e5e0d5;--txt:#1f2a44;--mut:#6b7280;--ok:#2f8f5b;--ok-l:#e3f3ea;--warn:#c27c0e;--warn-l:#fdf2d0;--red:#c0392b}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
/* lock */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),var(--navy2));padding:20px}
.lockbox{background:#fff;border-radius:16px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center}
.lockbox h1{margin:0;font-size:22px;letter-spacing:.5px}
.lockbox .sub{color:var(--gold);font-weight:700;margin:4px 0 22px}
.lockbox input{width:100%;padding:12px 14px;font-size:16px;border:1.5px solid var(--line);border-radius:10px;outline:none}
.lockbox input:focus{border-color:var(--gold)}
.lockbox button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:16px;font-weight:700}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:10px}
/* header */
header{background:var(--navy);color:#fff;padding:18px 24px 0;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.htop{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;max-width:1280px;margin:0 auto}
.htop h1{margin:0;font-size:22px;letter-spacing:.5px}
.htop .range{color:var(--gold);font-weight:700;font-size:18px}
.htop .desc{color:#c8cfdd;font-size:13px}
.dates{display:flex;gap:8px;flex-wrap:wrap;max-width:1280px;margin:14px auto 0}
.chip{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:999px;padding:6px 14px;font-size:14px}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}
.tabs{display:flex;gap:4px;max-width:1280px;margin:12px auto 0;overflow-x:auto}
.tab{border:0;background:transparent;color:#c8cfdd;padding:11px 16px;font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:#fff;border-bottom-color:var(--gold);font-weight:700}
.tab .badge{display:inline-block;background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:5px;vertical-align:2px}
main{max-width:1280px;margin:0 auto;padding:22px 24px 60px}
h2{font-size:18px;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
h2:first-child{margin-top:0}
h2::before{content:"";width:5px;height:18px;background:var(--gold);border-radius:3px}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{color:var(--mut);font-size:13px}
.kpi .v{font-size:28px;font-weight:800;margin-top:4px}
.kpi.warn .v{color:var(--warn)}.kpi.ok .v{color:var(--ok)}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--gold)}
/* table */
.tbl{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.tbl th{white-space:nowrap;background:var(--navy);color:#fff;font-weight:600;padding:10px 12px;text-align:left;font-size:14px}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.tbl tr.rowlink{cursor:pointer}.tbl tr.rowlink:hover td{background:#faf7ef}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}
/* office cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:0 0 4px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.cnt{background:var(--gold-l);color:#7a5a12;border-radius:999px;font-size:12px;padding:2px 10px;font-weight:700}
.staff{margin-top:12px}
.staff .nm{font-weight:700;font-size:14px}
.staff .id{color:var(--mut);font-size:12px;margin-left:4px}
.stores{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.st{border:1px solid var(--line);background:#fbfaf7;border-radius:8px;padding:4px 9px;font-size:13px;color:var(--txt)}
.st:hover{border-color:var(--gold);background:var(--gold-l)}
.st.nophoto{color:var(--mut);border-style:dashed;cursor:default;background:#fff}
.st.hasoos{border-color:#e7c46a}
.st .d{color:var(--mut);font-size:11px;margin-right:4px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:4px;vertical-align:1px}
/* oos */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.fbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--txt)}
.fbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
select,input.search{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-family:inherit;color:var(--txt)}
.oos{background:#fff;border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;cursor:pointer}
.oos.track{border-left-color:var(--warn);background:#fffcf3}
.oos:hover{box-shadow:0 4px 14px rgba(0,0,0,.06)}
.oos .top{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.oos .store{font-weight:800;font-size:16px}
.oos .meta{color:var(--mut);font-size:13px}
.oos .k{color:var(--mut);font-size:13px;white-space:nowrap}
.pill{border-radius:999px;font-size:12px;padding:2px 10px;font-weight:700}
.pill.ok{background:var(--ok-l);color:var(--ok)}.pill.warn{background:var(--warn-l);color:var(--warn)}
.oosl{display:grid;gap:10px}
/* photos */
.cats{display:flex;gap:6px;flex-wrap:wrap}
.sgrp{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.sgrp .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer}
.sgrp .hd b{font-size:16px}
.sgrp .note{margin-top:8px;background:#fdf6f5;border:1px solid #f1d3cf;color:#8a2c22;border-radius:8px;padding:6px 10px;font-size:13px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.th{position:relative;border-radius:8px;overflow:hidden;background:#eee;aspect-ratio:3/4;cursor:zoom-in}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:11px;padding:14px 6px 5px}
.loading{padding:30px;text-align:center;color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;max-width:320px;margin:10px auto 0}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
.empty{padding:30px;text-align:center;color:var(--mut);background:#fff;border-radius:12px;border:1px dashed var(--line)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(15,20,35,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto}
.mbox{background:#fff;border-radius:14px;width:100%;max-width:980px;padding:22px 24px;position:relative}
.mclose{position:absolute;right:14px;top:12px;border:0;background:#f1efe9;border-radius:50%;width:34px;height:34px;font-size:18px}
.mbox h3{margin:0;font-size:20px}
.mbox .meta{color:var(--mut);margin-top:6px;font-size:14px}
.mbox .gr{background:var(--red);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;margin-left:8px;vertical-align:3px}
.catsec h4{margin:18px 0 0;font-size:14px;color:#8a6a1e}
/* lightbox */
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column}
#lb img{max-width:94vw;max-height:82vh;border-radius:6px}
#lb .cap{color:#fff;margin-top:12px;font-size:14px;text-align:center}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.15);color:#fff;font-size:28px;width:48px;height:64px;border-radius:8px}
#lb .prev{left:10px}#lb .next{right:10px}
#lb .x{position:absolute;right:14px;top:12px;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:20px;width:40px;height:40px;border-radius:50%}
footer{color:var(--mut);font-size:12px;text-align:center;padding:10px 0 30px}
@media(max-width:640px){.dates{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.chip{flex:none}.kpis{grid-template-columns:repeat(2,1fr)}.kpi .v{font-size:24px}header{padding:14px 14px 0}main{padding:16px 14px 50px}.htop h1{font-size:18px}.htop .range{font-size:15px}.thumbs{grid-template-columns:repeat(3,1fr)}.mbox{padding:18px 14px}}
</style>
</head>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let KEY=null,D=null;
const S={date:'all',tab:'sum',oosF:'all',office:'all',cat:'all',q:''};
const IMG={};const loaded={};const loading={};
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(LOCK.salt),iterations:LOCK.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
}
const dec=(key,u8)=>crypto.subtle.decrypt({name:'AES-GCM',iv:u8.slice(0,12)},key,u8.slice(12));
async function unlock(pw){
  const key=await derive(pw);
  const buf=await dec(key,b64(LOCK.meta));
  KEY=key;D=JSON.parse(new TextDecoder().decode(buf));
}
document.getElementById('lockform').addEventListener('submit',async e=>{
  e.preventDefault();const pw=document.getElementById('pw').value;const err=document.getElementById('err');
  if(!window.crypto||!crypto.subtle){err.textContent='此瀏覽器不支援解密，請改用 Chrome / Edge / Safari 開啟網址';return}
  err.textContent='驗證中…';document.getElementById('unlockbtn').disabled=true;
  try{await unlock(pw);try{sessionStorage.setItem('pxpw',pw)}catch(_){}start()}
  catch(_){err.textContent='密碼錯誤，請再試一次'}
  document.getElementById('unlockbtn').disabled=false;
});
(async()=>{let pw=null;try{pw=sessionStorage.getItem('pxpw')}catch(_){}
  if(pw){try{await unlock(pw);start()}catch(_){}}})();

const md=d=>{const [,m,dd]=d.split('-');return `${+m}/${+dd}`};
const dl=d=>md(d)+(d==='2026-11-13'?'（上午）':'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const splitStaff=s=>s.split('、').map(x=>{const m=x.match(/^(.*?)-(\d+)$/);return m?{nm:m[1],id:m[2]}:{nm:x,id:''}});
let DATES=[];
function start(){
  document.getElementById('lock').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
  DATES=[...new Set(D.plan.map(p=>p.date))].sort();
  D.vmap={};D.visits.forEach((v,i)=>{v.i=i;D.vmap[v.date+'|'+v.store]=v});
  D.oosmap={};D.oos.forEach(o=>{(D.oosmap[o.date+'|'+o.store]??=[]).push(o)});
  render();
}
const inDate=d=>S.date==='all'||d===S.date;
function render(){
  document.getElementById('dates').innerHTML=[['all','整週'],...DATES.map(d=>[d,dl(d)])].map(([k,l])=>`<button class="chip ${S.date===k?'on':''}" onclick="S.date='${k}';render()">${l}</button>`).join('');
  const track=D.oos.filter(o=>inDate(o.date)&&o.status==='需追蹤').length;
  const T=[['sum','總表'],['oos','缺貨通知'+(track?`<span class="badge">${track}</span>`:'')],['staff','巡補人員'],['photo','照片']];
  document.getElementById('tabs').innerHTML=T.map(([k,l])=>`<button class="tab ${S.tab===k?'on':''}" onclick="S.tab='${k}';render()">${l}</button>`).join('');
  const m=document.getElementById('main');
  m.innerHTML=({sum:vSum,oos:vOos,staff:vStaff,photo:vPhoto})[S.tab]();
  if(S.tab==='photo')loadPhotos();
}
function stats(d){
  const P=D.plan.filter(p=>p.date===d),O=D.oos.filter(o=>o.date===d);
  return {offices:new Set(P.map(p=>p.office)).size,stores:P.reduce((a,p)=>a+p.stores.length,0),oos:O.length,ok:O.filter(o=>o.status!=='需追蹤').length,tr:O.filter(o=>o.status==='需追蹤').length,staff:new Set(P.flatMap(p=>p.staff)).size};
}
function vSum(){
  const ds=S.date==='all'?DATES:[S.date];const st=ds.map(stats);
  const tot=k=>st.reduce((a,s)=>a+s[k],0);
  const offs=new Set(D.plan.filter(p=>inDate(p.date)).map(p=>p.office)).size;
  let h=`<h2>${S.date==='all'?'整週總覽':dl(S.date)+' 總覽'}</h2><div class="kpis">
   <div class="kpi"><div class="l">營業所數</div><div class="v">${offs}</div></div>
   <div class="kpi"><div class="l">巡補門市數</div><div class="v">${tot('stores')}</div></div>
   <div class="kpi click" onclick="S.tab='oos';S.oosF='all';render()"><div class="l">缺貨回報筆數</div><div class="v">${tot('oos')}</div></div>
   <div class="kpi ok click" onclick="S.tab='oos';S.oosF='ok';render()"><div class="l">已處理／在途</div><div class="v">${tot('ok')}</div></div>
   <div class="kpi warn click" onclick="S.tab='oos';S.oosF='track';render()"><div class="l">需追蹤</div><div class="v">${tot('tr')}</div></div></div>`;
  if(S.date==='all'){
    h+=`<h2>各日巡補家數與缺貨處理狀況</h2><div class="tblwrap"><table class="tbl"><tr><th>日期</th><th class="num">營業所數</th><th class="num">巡補人員</th><th class="num">巡補門市數</th><th class="num">缺貨回報</th><th class="num">已處理／在途</th><th class="num">需追蹤</th></tr>`+
    DATES.map((d,i)=>`<tr class="rowlink" onclick="S.date='${d}';render()"><td><b>${dl(d)}</b></td><td class="num">${st[i].offices}</td><td class="num">${st[i].staff}</td><td class="num">${st[i].stores}</td><td class="num">${st[i].oos}</td><td class="num" style="color:var(--ok)">${st[i].ok}</td><td class="num" style="color:var(--warn);font-weight:700">${st[i].tr}</td></tr>`).join('')+
    `<tr><td><b>合計</b></td><td class="num">—</td><td class="num">—</td><td class="num"><b>${tot('stores')}</b></td><td class="num"><b>${tot('oos')}</b></td><td class="num"><b>${tot('ok')}</b></td><td class="num"><b>${tot('tr')}</b></td></tr></table></div>`;
  }
  // by office
  const P=D.plan.filter(p=>inDate(p.date));const by={};
  P.forEach(p=>{(by[p.office]??={stores:0,dates:new Set,staff:new Set});by[p.office].stores+=p.stores.length;by[p.office].dates.add(p.date);p.staff.forEach(s=>by[p.office].staff.add(s))});
  const O=D.oos.filter(o=>inDate(o.date));
  const offOf=(o)=>{const v=D.vmap[o.date+'|'+o.store];if(v)return v.office;const p=D.plan.find(p=>p.date===o.date&&p.stores.includes(o.store));return p?p.office:''};
  h+=`<h2>各營業所</h2><div class="tblwrap"><table class="tbl"><tr><th>營業所</th><th class="num">巡補門市數</th><th class="num">巡補人員</th>${S.date==='all'?'<th class="num">出勤天數</th>':''}<th class="num">缺貨回報</th><th class="num">需追蹤</th></tr>`+
   Object.entries(by).sort((a,b)=>b[1].stores-a[1].stores).map(([k,v])=>{const oo=O.filter(o=>offOf(o)===k);return `<tr class="rowlink" onclick="S.tab='photo';S.office='${k}';render()"><td><b>${k}</b></td><td class="num">${v.stores}</td><td class="num">${v.staff.size}</td>${S.date==='all'?`<td class="num">${v.dates.size}</td>`:''}<td class="num">${oo.length}</td><td class="num" style="color:var(--warn);font-weight:700">${oo.filter(o=>o.status==='需追蹤').length||''}</td></tr>`}).join('')+`</table></div>
   <p style="color:var(--mut);font-size:13px">點選日期列可切換到該日；點選營業所可查看該營業所的照片。</p>`;
  return h;
}
function vOos(){
  let O=D.oos.filter(o=>inDate(o.date));
  const n={all:O.length,track:O.filter(o=>o.status==='需追蹤').length,ok:O.filter(o=>o.status!=='需追蹤').length};
  if(S.oosF==='track')O=O.filter(o=>o.status==='需追蹤');if(S.oosF==='ok')O=O.filter(o=>o.status!=='需追蹤');
  O=[...O].sort((a,b)=>(a.status==='需追蹤'?0:1)-(b.status==='需追蹤'?0:1)||a.date.localeCompare(b.date));
  let h=`<h2>缺貨通知</h2><div class="filters">${[['all','全部'],['track','需追蹤'],['ok','已處理／在途']].map(([k,l])=>`<button class="fbtn ${S.oosF===k?'on':''}" onclick="S.oosF='${k}';render()">${l}（${n[k]}）</button>`).join('')}</div>`;
  if(!O.length)return h+`<div class="empty">此條件下沒有缺貨回報</div>`;
  return h+`<div class="oosl">`+O.map(o=>{const v=D.vmap[o.date+'|'+o.store];const t=o.status==='需追蹤';
   return `<div class="oos ${t?'track':''}" ${v?`onclick="openStore(${v.i})"`:''}><div class="top"><span class="store">${esc(o.store)}</span><span class="pill ${t?'warn':'ok'}">${t?'需追蹤':'已處理／在途'}</span><span class="meta">${dl(o.date)}${v?'｜'+esc(v.office)+'｜'+esc(v.staff.replace(/-\d+/g,'')):''}${v?'｜📷 '+v.photos.length+' 張':'｜無照片頁'}</span></div>
   <span class="k">缺貨品項</span><span>${esc(o.item)||'—'}</span><span class="k">處理進度</span><span>${esc(o.progress)||'—'}</span></div>`}).join('')+`</div>`;
}
function vStaff(){
  const P=D.plan.filter(p=>inDate(p.date));const by={};
  P.forEach(p=>{const o=(by[p.office]??={});const key=p.staff.join('、');(o[key]??=[]).push(...p.stores.map(s=>({s,d:p.date})))});
  const staffN=new Set(P.flatMap(p=>p.staff)).size;
  let h=`<h2>${S.date==='all'?'整週':dl(S.date)} 巡補人員（${staffN} 人）</h2><div class="grid">`;
  for(const [off,m] of Object.entries(by).sort()){
    const total=Object.values(m).reduce((a,x)=>a+x.length,0);
    h+=`<div class="card"><h3>${off}<span class="cnt">${total} 店</span></h3>`;
    for(const [k,arr] of Object.entries(m)){
      const ps=splitStaff(k);
      h+=`<div class="staff"><div>${ps.map(p=>`<span class="nm">${esc(p.nm)}</span><span class="id">${p.id}</span>`).join('、')} <span class="id">· ${arr.length} 店</span></div><div class="stores">`+
      arr.map(({s,d})=>{const v=D.vmap[d+'|'+s];const oo=D.oosmap[d+'|'+s];
        return v?`<button class="st ${oo?'hasoos':''}" onclick="openStore(${v.i})">${S.date==='all'?`<span class="d">${md(d)}</span>`:''}${esc(s)}${oo?'<span class="dot" title="有缺貨回報"></span>':''}</button>`
                :`<span class="st nophoto" title="報告中無此門市照片頁">${S.date==='all'?`<span class="d">${md(d)}</span>`:''}${esc(s)}</span>`}).join('')+`</div></div>`;
    }
    h+=`</div>`;
  }
  return h+`</div><p style="color:var(--mut);font-size:13px">點選門市可查看照片與備註；<span class="dot"></span> 表示有缺貨回報；虛線框表示報告中沒有該門市的照片頁。</p>`;
}
function photoVisits(){
  const q=S.q.trim();
  return D.visits.filter(v=>inDate(v.date)&&(S.office==='all'||v.office===S.office)&&(!q||(v.store+v.staff+v.office).includes(q)));
}
function vPhoto(){
  const offices=[...new Set(D.visits.filter(v=>inDate(v.date)).map(v=>v.office))].sort();
  if(S.office!=='all'&&!offices.includes(S.office))S.office='all';
  const V=photoVisits();
  let h=`<h2>門市照片</h2><div class="filters">
   <select onchange="S.office=this.value;render()"><option value="all">全部營業所</option>${offices.map(o=>`<option ${S.office===o?'selected':''}>${o}</option>`).join('')}</select>
   <input class="search" placeholder="搜尋門市或人員" value="${esc(S.q)}" oninput="S.q=this.value;clearTimeout(window._t);window._t=setTimeout(()=>{render();const e=document.querySelector('input.search');e.focus();e.setSelectionRange(e.value.length,e.value.length)},350)">
  </div><div class="filters cats">${[['all','全部分類'],...CATS.map(c=>[c,c.replace('陳列','')])].map(([k,l])=>`<button class="fbtn ${S.cat===k?'on':''}" onclick="S.cat='${k}';render()">${l}</button>`).join('')}</div>
  <div id="plist">`;
  if(!V.length)return h+`<div class="empty">找不到符合的門市</div></div>`;
  h+=V.map(v=>{const ph=v.photos.filter(p=>S.cat==='all'||p.cat===S.cat);if(!ph.length)return '';const oo=D.oosmap[v.date+'|'+v.store];
   return `<div class="sgrp"><div class="hd" onclick="openStore(${v.i})"><div><b>${esc(v.store)}</b> <span class="meta" style="color:var(--mut);font-size:13px">${dl(v.date)}｜${esc(v.office)}｜${esc(v.staff.replace(/-\d+/g,''))}</span></div>${oo?`<span class="pill ${oo.some(o=>o.status==='需追蹤')?'warn':'ok'}">缺貨 ${oo.length}</span>`:''}</div>
   ${v.note?`<div class="note">備註：${esc(v.note)}</div>`:''}<div class="thumbs">${ph.map(p=>thumb(p,v)).join('')}</div></div>`}).join('');
  return h+`</div>`;
}
function thumb(p,v){return `<div class="th" onclick="openLB(${v.i},'${p.id}')"><img data-id="${p.id}" ${IMG[p.id]?`src="${IMG[p.id]}"`:''} alt="" loading="lazy"><span>${p.cat.replace('陳列','')}</span></div>`}
async function loadDate(d,onp){
  if(loaded[d])return;if(loading[d])return loading[d];
  loading[d]=(async()=>{
    const r=await fetch(D.files[d]);if(!r.ok)throw new Error('fetch '+r.status);
    const total=+r.headers.get('content-length')||0;const rd=r.body.getReader();const chunks=[];let got=0;
    for(;;){const {done,value}=await rd.read();if(done)break;chunks.push(value);got+=value.length;onp&&total&&onp(got/total)}
    const u8=new Uint8Array(got);let o=0;for(const c of chunks){u8.set(c,o);o+=c.length}
    const buf=new Uint8Array(await dec(KEY,u8));const hl=new DataView(buf.buffer).getUint32(0,true);
    const idx=JSON.parse(new TextDecoder().decode(buf.slice(4,4+hl)));const base=4+hl;
    for(const [id,off,len] of idx)IMG[id]=URL.createObjectURL(new Blob([buf.slice(base+off,base+off+len)],{type:'image/jpeg'}));
    loaded[d]=true;
  })();
  return loading[d];
}
function fillImgs(root=document){root.querySelectorAll('img[data-id]').forEach(i=>{if(!i.src&&IMG[i.dataset.id])i.src=IMG[i.dataset.id]})}
async function loadPhotos(){
  const need=[...new Set(photoVisits().map(v=>v.date))].filter(d=>!loaded[d]);if(!need.length)return;
  const pl=document.getElementById('plist');const box=document.createElement('div');box.className='loading';
  box.innerHTML=`照片載入中…<div class="bar"><i id="pbar"></i></div>`;pl&&pl.prepend(box);
  let done=0;
  try{for(const d of need){await loadDate(d,f=>{const b=document.getElementById('pbar');if(b)b.style.width=((done+f)/need.length*100)+'%'});done++;fillImgs()}box.remove()}
  catch(e){box.innerHTML='照片載入失敗，請重新整理頁面再試一次'}
}
function openStore(i){
  const v=D.visits[i];const oo=D.oosmap[v.date+'|'+v.store]||[];
  let h=`<button class="mclose" onclick="closeModal()">✕</button><h3>${esc(v.store)}${v.grade?`<span class="gr">${v.grade} 級點</span>`:''}</h3>
  <div class="meta">${esc(v.office)}｜訪員：${esc(v.staff)}｜巡補日期：${v.date}</div>
  ${v.note?`<div class="sgrp note" style="margin-top:12px;padding:8px 12px;background:#fdf6f5;border-color:#f1d3cf;color:#8a2c22">備註：${esc(v.note)}</div>`:''}
  ${oo.map(o=>`<div class="oos ${o.status==='需追蹤'?'track':''}" style="margin-top:10px;cursor:default"><div class="top"><span class="pill ${o.status==='需追蹤'?'warn':'ok'}">${o.status==='需追蹤'?'需追蹤':'已處理／在途'}</span></div><span class="k">缺貨品項</span><span>${esc(o.item)}</span><span class="k">處理進度</span><span>${esc(o.progress)}</span></div>`).join('')}`;
  for(const c of CATS){const ph=v.photos.filter(p=>p.cat===c);if(!ph.length)continue;
    h+=`<div class="catsec"><h4>${c}（${ph.length}）</h4><div class="thumbs">${ph.map(p=>thumb(p,v)).join('')}</div></div>`}
  if(!loaded[v.date])h+=`<div class="loading" id="mload">照片載入中…</div>`;
  const mb=document.getElementById('mbox');mb.innerHTML=h;document.getElementById('modal').classList.remove('hidden');document.body.style.overflow='hidden';
  loadDate(v.date).then(()=>{fillImgs(mb);const l=document.getElementById('mload');l&&l.remove()}).catch(()=>{const l=document.getElementById('mload');if(l)l.textContent='照片載入失敗'});
}
function closeModal(){document.getElementById('modal').classList.add('hidden');document.body.style.overflow=''}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
let LB={list:[],k:0};
function openLB(i,id){const v=D.visits[i];const ph=document.getElementById('modal').classList.contains('hidden')&&S.cat!=='all'?v.photos.filter(p=>p.cat===S.cat):v.photos;
  LB={v,list:ph,k:Math.max(0,ph.findIndex(p=>p.id===id))};showLB();document.getElementById('lb').classList.remove('hidden')}
async function showLB(){const p=LB.list[LB.k];const im=document.getElementById('lbimg');
  if(!IMG[p.id]){im.removeAttribute('src');await loadDate(LB.v.date)}
  im.src=IMG[p.id];document.getElementById('lbcap').textContent=`${LB.v.store}｜${p.cat}｜${LB.k+1} / ${LB.list.length}`}
function stepLB(d){LB.k=(LB.k+d+LB.list.length)%LB.list.length;showLB()}
function closeLB(){document.getElementById('lb').classList.add('hidden')}
document.addEventListener('keydown',e=>{const lb=!document.getElementById('lb').classList.contains('hidden');
  if(e.key==='Escape'){lb?closeLB():closeModal()}if(lb&&e.key==='ArrowRight')stepLB(1);if(lb&&e.key==='ArrowLeft')stepLB(-1)});
let tx=0;document.getElementById('lb').addEventListener('touchstart',e=>tx=e.touches[0].clientX);
document.getElementById('lb').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)stepLB(dx<0?1:-1)});
</script>
</body>
